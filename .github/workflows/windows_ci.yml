name: Windows CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PUB_CACHE: ${{ github.workspace }}\tool\pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test native installer transactions and update handoff
        run: |
          & .\scripts\verify_installer_native.ps1 -BuildDirectory (Join-Path $env:GITHUB_WORKSPACE 'tool\qa-installer\build')

      - name: Preserve native installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-native-diagnostics-${{ github.sha }}
          path: |
            tool/qa-installer/build/native-gate-*.log
            tool/qa-installer/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          architecture: x64
          cache: true
          pub-cache-path: ${{ github.workspace }}/tool/pub-cache

      # The vendored Cargokit invokes `rustup run stable` explicitly. Install
      # that channel rather than an unused version-named toolchain. The local
      # Windows validation used stable rustc 1.98.0 with Flutter 3.47.1.
      - name: Set up Rust stable (MSVC x64)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Record toolchain and prepare both Flutter projects
        run: |
          $ErrorActionPreference = 'Stop'
          $flutter = (Get-Command flutter.bat).Source
          $env:FLUTTER_ROOT = Split-Path -Parent (Split-Path -Parent $flutter)
          "FLUTTER_ROOT=$env:FLUTTER_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $flutter --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter version check failed.' }
          rustup run stable rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Rust stable is unavailable.' }
          & .\scripts\prepare_windows_dependencies.ps1 -ProjectRoot $env:GITHUB_WORKSPACE -Flutter $flutter
          & .\scripts\prepare_windows_dependencies.ps1 -ProjectRoot (Join-Path $env:GITHUB_WORKSPACE 'third_party\desktop_lyric') -Flutter $flutter

      - name: Analyze and test Dan Player
        run: |
          flutter analyze --no-pub --no-fatal-infos lib test
          if ($LASTEXITCODE -ne 0) { throw 'Dan Player analysis failed.' }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Dan Player tests failed.' }
          rustup run stable cargo test --manifest-path rust/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
          python -B -m unittest discover -s scripts -p test_audit_classification_metadata.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Metadata audit privacy tests failed.' }

      - name: Analyze and test desktop lyrics
        working-directory: third_party/desktop_lyric
        run: |
          flutter analyze --no-pub --no-fatal-infos lib
          if ($LASTEXITCODE -ne 0) { throw 'Desktop lyrics analysis failed.' }
          if (Test-Path -LiteralPath test -PathType Container) {
            flutter test --no-pub
            if ($LASTEXITCODE -ne 0) { throw 'Desktop lyrics tests failed.' }
          } else {
            Write-Host 'The desktop lyrics package currently has no standalone test directory.'
          }

      - name: Build Dan Player release
        run: |
          & .\scripts\invalidate_windows_icon_assets.ps1 -ProjectRoot $env:GITHUB_WORKSPACE
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Dan Player release build failed.' }
          & .\scripts\verify_windows_release_fonts.ps1 -ProjectRoot $env:GITHUB_WORKSPACE

      - name: Test native backdrop and desktop integration policies
        run: |
          cmake --build build/windows/x64 --config Release --target window_resize_policy_test window_corner_region_test window_backdrop_policy_test window_backdrop_updates_test desktop_integration_policy_test taskbar_thumbnail_policy_test taskbar_peek_bitmap_test taskbar_peek_geometry_test desktop_integration_fonts_test desktop_integration_blur_test desktop_integration_paint_test installer_launch_test windows_shell_policy_test
          if ($LASTEXITCODE -ne 0) { throw 'Native backdrop tests did not compile.' }
          & .\build\windows\x64\window_tests\Release\window_resize_policy_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native window resize policy tests failed.' }
          & .\build\windows\x64\window_tests\Release\window_corner_region_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Hidden window corner-region tests failed.' }
          & .\build\windows\x64\backdrop_tests\Release\window_backdrop_policy_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native backdrop compatibility tests failed.' }
          & .\build\windows\x64\backdrop_tests\Release\window_backdrop_updates_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native backdrop drag/lifecycle tests failed.' }
          & .\build\windows\x64\desktop_tests\Release\desktop_integration_policy_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native tray/taskbar policy tests failed.' }
          & .\build\windows\x64\desktop_tests\Release\taskbar_thumbnail_policy_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native taskbar thumbnail tests failed.' }
          & .\build\windows\x64\desktop_tests\Release\taskbar_peek_bitmap_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native taskbar Peek size/pixel/lifetime tests failed.' }
          & .\build\windows\x64\desktop_tests\Release\taskbar_peek_geometry_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Hidden minimized-window Peek geometry tests failed.' }
          & .\build\windows\x64\desktop_tests\Release\desktop_integration_fonts_test.exe .\assets\fonts\PingFangSC-Regular.ttf .\build\windows\x64\runner\Release\data\flutter_assets\packages\material_symbols_icons\lib\fonts\MaterialSymbolsOutlined.ttf
          if ($LASTEXITCODE -ne 0) { throw 'Native tray font lifetime tests failed.' }
          & .\build\windows\x64\desktop_tests\Release\desktop_integration_blur_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native tray Gaussian blur/lifetime tests failed.' }
          & .\build\windows\x64\desktop_tests\Release\desktop_integration_paint_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native tray atomic-paint/clipping/lifetime tests failed.' }
          & .\build\windows\x64\desktop_tests\Release\installer_launch_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Installer verification/handshake tests failed.' }
          & .\build\windows\x64\desktop_tests\Release\windows_shell_policy_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows shell action and instance policy tests failed.' }

      - name: Build desktop lyrics release
        working-directory: third_party/desktop_lyric
        run: |
          & ..\..\scripts\invalidate_windows_icon_assets.ps1 -ProjectRoot (Get-Location).Path
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Desktop lyrics release build failed.' }
          & ..\..\scripts\verify_windows_release_fonts.ps1 -ProjectRoot (Get-Location).Path

      - name: Test owned lyric window geometry and focus
        working-directory: third_party/desktop_lyric
        run: |
          # A clean Flutter build creates SDK wrapper sources after CMake's
          # first configure. Discover the opt-in real-AOT test now that they
          # exist, without running flutter_assemble again.
          cmake -S windows -B build/windows/x64
          if ($LASTEXITCODE -ne 0) { throw 'Post-build lyric test configuration failed.' }
          cmake --build build/windows/x64 --config Release --target desktop_lyric_owned_window_test desktop_lyric_palette_engine_test
          if ($LASTEXITCODE -ne 0) { throw 'Owned lyric window regression did not compile.' }
          $palettePreviousPath = $env:Path
          try {
            $env:Path = "$(Join-Path (Get-Location).Path 'windows\flutter\ephemeral');$env:Path"
            & .\build\windows\x64\palette_tests\Release\desktop_lyric_owned_window_test.exe
            if ($LASTEXITCODE -ne 0) { throw 'Owned lyric HWND geometry/focus regression failed.' }
            & .\build\windows\x64\palette_tests\Release\desktop_lyric_palette_engine_test.exe (Join-Path (Get-Location).Path 'build\windows\x64\runner\Release\data')
            if ($LASTEXITCODE -ne 0) { throw 'Hidden lyric palette AOT startup/reuse regression failed.' }
          } finally {
            $env:Path = $palettePreviousPath
          }

      - name: Cache pinned BASS and tempo packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/tool/bass
            ${{ github.workspace }}/tool/bass-fx
          key: bass-tempo-windows-x64-${{ hashFiles('scripts/prepare_bass_runtime.ps1', 'scripts/prepare_bass_fx_runtime.ps1') }}

      - name: Download and verify all nine BASS packages
        run: |
          $runtime = & .\scripts\prepare_bass_runtime.ps1 -CacheRoot (Join-Path $env:GITHUB_WORKSPACE 'tool\bass')
          Write-Host "Verified runtime: $($runtime.RuntimeDirectory)"
          $tempoRuntime = & .\scripts\prepare_bass_fx_runtime.ps1 -CacheRoot (Join-Path $env:GITHUB_WORKSPACE 'tool\bass-fx')
          Write-Host "Verified tempo runtime: $($tempoRuntime.RuntimeDirectory)"

      # This path never invokes the local signing script and has no private
      # certificate/secret configuration. It produces an unsigned CI artifact,
      # not a GitHub Release or an automatic update publication.
      - name: Assemble portable ZIP and SHA256SUMS
        id: package
        run: |
          $package = & .\scripts\assemble_windows_release.ps1 -BassCacheRoot (Join-Path $env:GITHUB_WORKSPACE 'tool\bass') -BassFxCacheRoot (Join-Path $env:GITHUB_WORKSPACE 'tool\bass-fx') -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'dist')
          "zip=$($package.ZipPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksums=$($package.ChecksumPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DanPlayer-windows-x64-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.checksums }}
          if-no-files-found: error
          retention-days: 14
